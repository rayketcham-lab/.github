<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ketcham Lab — automation, orchestration, deployment pipelines">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1F262E"/>
    </pattern>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#6AA6FF"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="298" rx="18"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="#0E1114" stroke="#29323B" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect x="1" y="1" width="1198" height="298" fill="url(#dots)"/>
    <rect x="1" y="1" width="1198" height="3" fill="url(#hub)" opacity="0.7"/>
  </g>

  <!-- terminal chrome -->
  <circle cx="46" cy="46" r="7" fill="#E5736B"/>
  <circle cx="72" cy="46" r="7" fill="#E5B567"/>
  <circle cx="98" cy="46" r="7" fill="#3DDC97"/>
  <text x="1154" y="52" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#4A5560">~/ketcham-lab</text>

  <!-- prompt chevron -->
  <polyline points="72,124 100,152 72,180" fill="none" stroke="#3DDC97" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- command line -->
  <text x="126" y="171" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#E6EAEE" letter-spacing="1">ketcham-lab</text>

  <!-- animated cursor -->
  <rect x="530" y="126" width="28" height="54" fill="#3DDC97">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- pipeline: source box -> CI gate -> destination nodes (subtle greys, no green outline) -->
  <g stroke="#4A5560" stroke-width="2.5" fill="none">
    <path d="M 700 218 H 760"/>
    <path d="M 830 218 H 880" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 950 218 H 1000" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" begin="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M 1070 218 H 1120" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- origin box: neutral code chip (no border color pop) -->
  <rect x="640" y="200" width="60" height="36" rx="7" fill="#1A2129" stroke="#4A5560" stroke-width="2"/>
  <text x="670" y="223" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#A8B3BD">&lt;/&gt;</text>

  <!-- CI gate: small check node on the first connector -->
  <circle cx="780" cy="218" r="9" fill="#1A2129" stroke="#4A5560" stroke-width="2"/>
  <polyline points="775,218 779,222 786,214" fill="none" stroke="#3DDC97" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- destination nodes -->
  <g fill="#1A2129" stroke="#4A5560" stroke-width="2">
    <rect x="880" y="202" width="24" height="32" rx="5"/>
    <rect x="1000" y="202" width="24" height="32" rx="5"/>
    <rect x="1120" y="202" width="24" height="32" rx="5"/>
  </g>
  <g fill="#6AA6FF" opacity="0.9">
    <circle cx="892" cy="212" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1012" cy="212" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1132" cy="212" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- comment line -->
  <text x="72" y="232" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="22" fill="#7C8894"><tspan fill="#4A5560"># </tspan>build automation<tspan fill="#4A5560" dx="10">·</tspan><tspan dx="10">agent orchestration</tspan><tspan fill="#4A5560" dx="10">·</tspan><tspan dx="10">continuous deployment</tspan></text>

  <!-- footer line -->
  <text x="72" y="268" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#4A5560">ship everywhere from <tspan fill="#6AA6FF">one source of truth</tspan></text>
</svg>
