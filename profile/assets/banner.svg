<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ketcham Lab — cyber security, PKI, encryption">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A0F"/>
      <stop offset="0.55" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#06121A"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF9C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titlegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8FFF4"/>
      <stop offset="1" stop-color="#5CFFC2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F2A3C" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- backdrop -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- binary rain columns (dim, drifting) -->
    <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" fill="#123A4E">
      <text x="180" y="60">10110<tspan dy="0">010</tspan></text>
      <text x="180" y="80">01001</text>
      <text x="180" y="100">11100</text>
      <text x="300" y="250">01101</text>
      <text x="300" y="270">10011</text>
      <text x="1050" y="70">01011</text>
      <text x="1050" y="90">10110</text>
      <text x="1050" y="110">00101</text>
      <text x="900" y="60">11010</text>
      <text x="960" y="265">01001</text>
      <text x="60" y="200">10010</text>
      <text x="60" y="220">01101</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 40; 0 0" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- hex ring shield (PKI/key feel), right side -->
    <g transform="translate(1050,150)">
      <!-- rotating outer hex ring -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <path d="M 0 -78 L 67.5 -39 L 67.5 39 L 0 78 L -67.5 39 L -67.5 -39 Z" fill="none" stroke="#00FF9C" stroke-opacity="0.28" stroke-width="1.5"/>
        <path d="M 0 -60 L 52 -30 L 52 30 L 0 60 L -52 30 L -52 -30 Z" fill="none" stroke="#00FF9C" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="10 6"/>
      </g>
      <!-- static inner shield + keyhole -->
      <path d="M 0 -30 L 26 -18 L 26 10 Q 26 32 0 44 Q -26 32 -26 10 L -26 -18 Z" fill="#071018" stroke="#00FF9C" stroke-width="2" stroke-opacity="0.9"/>
      <circle cx="0" cy="4" r="7" fill="none" stroke="#00FF9C" stroke-width="2"/>
      <line x1="0" y1="11" x2="0" y2="26" stroke="#00FF9C" stroke-width="2" stroke-linecap="round"/>
      <!-- key pulses -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#00FF9C" stroke-opacity="0.35" stroke-width="1">
        <animate attributeName="r" values="30;72" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.4;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- scanning beam -->
    <rect x="0" y="0" width="1200" height="46" fill="url(#scanline)" opacity="0.10">
      <animate attributeName="y" values="-46;300" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- header: classification-style tag -->
    <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
      <rect x="56" y="42" width="196" height="26" rx="4" fill="none" stroke="#00FF9C" stroke-opacity="0.5" stroke-width="1"/>
      <text x="66" y="60" font-size="13" fill="#00FF9C" letter-spacing="2">SECURE // KETCHAM</text>
      <rect x="262" y="42" width="118" height="26" rx="4" fill="none" stroke="#00FF9C" stroke-opacity="0.25" stroke-width="1"/>
      <text x="272" y="60" font-size="13" fill="#3E8E71" letter-spacing="2">AES-256</text>
      <rect x="390" y="42" width="150" height="26" rx="4" fill="none" stroke="#00FF9C" stroke-opacity="0.25" stroke-width="1"/>
      <text x="400" y="60" font-size="13" fill="#3E8E71" letter-spacing="2">RSA-4096</text>
      <rect x="550" y="42" width="126" height="26" rx="4" fill="none" stroke="#00FF9C" stroke-opacity="0.25" stroke-width="1"/>
      <text x="560" y="60" font-size="13" fill="#3E8E71" letter-spacing="2">EC-P384</text>
    </g>

    <!-- main title -->
    <text x="56" y="150" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="66" font-weight="700" fill="url(#titlegrad)" letter-spacing="4">KETCHAM LAB</text>

    <!-- subtitle with terminal cursor -->
    <text x="58" y="196" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="21" fill="#7FA696">$ ./init --crypto --pki --sign everything</text>
    <rect x="565" y="180" width="14" height="24" fill="#00FF9C">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- capability line as cipher fragments -->
    <text x="58" y="248" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#4E7A6A">
      <tspan fill="#00FF9C">▸</tspan> post-quantum pki
      <tspan dx="18" fill="#28513F">|</tspan><tspan dx="18">key infrastructure</tspan>
      <tspan dx="18" fill="#28513F">|</tspan><tspan dx="18">hardened pipelines</tspan>
      <tspan dx="18" fill="#28513F">|</tspan><tspan dx="18">zero-trust deploy</tspan>
    </text>

    <!-- footer status bar -->
    <rect x="0" y="272" width="1200" height="28" fill="#04131A"/>
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#00FF9C" stroke-opacity="0.3"/>
    <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="56" y="290" fill="#3E8E71">STATUS: <tspan fill="#00FF9C">REORGANIZING</tspan></text>
      <text x="280" y="290" fill="#3E8E71">REPOS: <tspan fill="#00FF9C">PRIVATE</tspan></text>
      <circle cx="404" cy="285" r="3.5" fill="#00FF9C">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="1144" y="290" text-anchor="end" fill="#28513F">0x4B45544348414D</text>
    </g>
  </g>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#0F3B2E" stroke-width="2"/>
</svg>
