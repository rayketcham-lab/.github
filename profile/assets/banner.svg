<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ketcham Lab — post-quantum PKI, cryptographic tooling, security engineering">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1F262E"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="298" rx="18"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="#0E1114" stroke="#29323B" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect x="1" y="1" width="1198" height="298" fill="url(#dots)"/>
    <!-- top accent hairline -->
    <rect x="1" y="1" width="1198" height="3" fill="#3DDC97" opacity="0.55"/>
  </g>

  <!-- terminal chrome -->
  <circle cx="46" cy="46" r="7" fill="#E5736B"/>
  <circle cx="72" cy="46" r="7" fill="#E5B567"/>
  <circle cx="98" cy="46" r="7" fill="#3DDC97"/>
  <text x="1154" y="52" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#4A5560">~/rayketcham-lab</text>

  <!-- prompt chevron -->
  <polyline points="72,124 100,152 72,180" fill="none" stroke="#3DDC97" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- command line -->
  <text x="126" y="171" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#E6EAEE" letter-spacing="1">ketcham-lab</text>

  <!-- cursor -->
  <rect x="530" y="126" width="28" height="54" fill="#3DDC97">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- comment line -->
  <text x="72" y="232" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="22" fill="#7C8894"><tspan fill="#4A5560"># </tspan>post-quantum pki<tspan fill="#4A5560" dx="10" dy="0">·</tspan><tspan dx="10">cryptographic tooling</tspan><tspan fill="#4A5560" dx="10">·</tspan><tspan dx="10">security engineering</tspan></text>

  <!-- footer line -->
  <text x="72" y="268" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#4A5560">home of <tspan fill="#6AA6FF">quantumnexum.com</tspan></text>
</svg>
